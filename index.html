<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veckans inköpslista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDEA; --surface:#FFFFFF; --ink:#16201B; --muted:#5A6861; --line:#D3DAD6;
  --accent:#1D6A45; --accent-ink:#FFFFFF; --tag:#FFD338; --tag-ink:#1A1600; --warn:#9A5B00; --paper:#FFFFFF;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#111614; --surface:#1A221F; --ink:#E6EDE9; --muted:#9AA9A1; --line:#2D3833;
  --accent:#5BC08A; --accent-ink:#0B1A12; --tag:#F0C12C; --tag-ink:#1A1600; --warn:#E6A84A; --paper:#F4F5F1; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A221F; --ink:#E6EDE9; --muted:#9AA9A1; --line:#2D3833;
  --accent:#5BC08A; --accent-ink:#0B1A12; --tag:#F0C12C; --tag-ink:#1A1600; --warn:#E6A84A; --paper:#F4F5F1; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}

header.top{padding:22px 0 10px}
h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:0;letter-spacing:.2px}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:10px;color:var(--muted);font-size:15px}
.status b{color:var(--ink);font-weight:600}
.upload{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;color:var(--ink);font-weight:600;background:transparent}
.upload:hover{background:var(--surface)}
.upload input{position:absolute;opacity:0;width:1px;height:1px}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
nav.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:10px;font-family:var(--display);font-weight:600;font-size:20px;cursor:pointer;color:var(--muted);white-space:nowrap}
nav.tabs button{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){nav.tabs{gap:1px}nav.tabs button{font-size:clamp(13px,3.9vw,18px);padding:9px 3px}}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.msg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 16px}
.msg.warn{border-color:var(--warn);color:var(--ink)}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}

/* Kvittot */
.receipt{background:var(--paper);color:#1A1A1A;padding:22px 20px 26px;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.08);margin-bottom:10px;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat, conic-gradient(from 135deg at 50% 100%,#000 90deg,#0000 0) bottom/16px 10px repeat-x;
          mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat, conic-gradient(from 135deg at 50% 100%,#000 90deg,#0000 0) bottom/16px 10px repeat-x;}
.receipt .store{font-family:var(--mono);font-size:15px;margin:0}
.receipt .store+.store{margin-top:18px}
.receipt .sname{font-weight:700;white-space:pre}
.receipt ul{list-style:none;margin:0;padding:0}
.receipt li{font-family:var(--mono);font-size:14.5px;line-height:1.5}
.receipt li button{all:unset;cursor:pointer;display:block;padding:2px 0 2px 1.5em;text-indent:-1.5em;overflow-wrap:anywhere}
.receipt li button:focus-visible{outline:2px solid #1D6A45}
.receipt li.off button{text-decoration:line-through;color:#9A9A9A}
.receipt li .x{font-family:var(--body);font-size:12px;font-weight:600;background:#FFD338;color:#1A1600;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
.receipt .empty{font-family:var(--body);color:#666}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 6px}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:17px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:7px 12px;font-size:15px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
.toast{min-height:1.4em;color:var(--accent);font-weight:600}
textarea.copybox{width:100%;min-height:160px;font-family:var(--mono);font-size:14px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}

details.check{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
details summary{cursor:pointer;font-weight:600}
.check li{margin:6px 0}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
#searchChips .chips{margin:12px 0 0}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font-weight:600;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.addrow{display:flex;gap:8px;margin-bottom:6px}
.addrow .searchbox{flex:1;font-size:17px;padding:11px 14px}
.progress{font-family:var(--display);font-weight:600;font-size:20px;margin:14px 0 0;color:var(--muted)}
.shoplist{list-style:none;margin:0;padding:0}
.shoplist li{display:flex;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.shoplist .tick{all:unset;box-sizing:border-box;flex:1;display:flex;gap:12px;align-items:center;padding:13px 14px;cursor:pointer;min-height:52px}
.shoplist .tick:focus-visible{outline:3px solid var(--accent);border-radius:12px}
.shoplist .box{flex:none;width:24px;height:24px;border:2px solid var(--muted);border-radius:7px;display:grid;place-items:center}
.shoplist li.done .box{background:var(--accent);border-color:var(--accent)}
.shoplist li.done .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.shoplist .txt{overflow-wrap:anywhere}
.offerhint{flex-basis:100%;font-size:14px;color:var(--muted);padding:0 14px 12px 50px;margin-top:-6px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;font-size:14px}
.offerhint .flag{background:var(--tag);color:var(--tag-ink);font-weight:600;font-size:12px;border-radius:4px;padding:1px 6px;margin-right:2px}
.shopchips{margin:12px 0 0}
.shoplist li.done .txt{text-decoration:line-through;color:var(--muted)}
.shoplist .rm{border:0;background:transparent;color:var(--muted);font-size:24px;line-height:1;padding:8px 14px;cursor:pointer}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.rcard h2{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.15;margin:0 0 6px}
.rcard h2 a{color:var(--ink);text-decoration:none}
.rcard h2 a:hover{text-decoration:underline}
.rmeta{margin:0 0 8px;color:var(--muted);font-size:15px}
.flag{background:var(--tag);color:var(--tag-ink);font-weight:600;font-size:12px;border-radius:4px;padding:1px 6px}
.rmeta .flag{font-size:13px}
.rsale{margin:0;padding-left:18px;font-size:15px}
.rsale li{margin:3px 0}
.rrest{margin-top:8px;font-size:15px}
.rrest summary{font-weight:600;color:var(--muted)}
.rcard .actions{margin:12px 0 0}
.homebox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;margin-bottom:16px}
.homehead{font-family:var(--display);font-weight:700;font-size:20px;margin:0 0 8px}
.homechips{margin:10px 0 6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chipx{opacity:.7}
.homeflag{background:var(--accent);color:var(--accent-ink)}
.rhome{margin:0 0 6px;font-size:15px;color:var(--muted)}
body.locked nav.tabs, body.locked section, body.locked .status{display:none !important}
#gate{margin-top:18px}
.plink{display:inline-flex;align-items:center;justify-content:center;min-width:32px;min-height:32px;border-radius:8px;color:var(--accent);text-decoration:none;font-weight:700;font-size:17px;flex:none}
.plink:hover{background:var(--bg)}
.receipt li{display:flex;align-items:flex-start;gap:4px}
.receipt li button{flex:1}
.receipt .plink{color:#1D6A45;min-height:26px;min-width:28px}
.receipt .plink:hover{background:#EEF1EE}
.hitact{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.hitlink{text-decoration:none}
.rsale .plink{min-width:24px;min-height:24px;font-size:15px}
/* Sök */
.searchbox{width:100%;font-size:20px;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.searchbox:focus{border-color:var(--accent);outline:none}
.results{margin-top:16px}
.res-store{font-family:var(--display);font-weight:700;font-size:22px;margin:18px 0 6px}
.hit{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line)}
.hit .n{font-weight:600}
.hit .d{color:var(--muted);font-size:14px}
.tagprice{font-family:var(--display);font-weight:700;font-size:22px;background:var(--tag);color:var(--tag-ink);padding:2px 10px;border-radius:6px;white-space:nowrap;justify-self:end}
.hit .add{grid-column:1/-1;justify-self:start}

/* Mina varor */
.cat{margin:22px 0 8px;font-family:var(--display);font-weight:700;font-size:24px;display:flex;justify-content:space-between;align-items:center}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:6px}
.item>button.row{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:baseline;width:100%;padding:11px 14px}
.item>button.row:focus-visible{outline:3px solid var(--accent);border-radius:12px}
.item .nm{font-weight:600;flex:1}
.item .cond{color:var(--muted);font-size:14px;text-align:right}
.edit{padding:4px 14px 14px;display:grid;gap:10px}
.edit label{display:grid;gap:3px;font-size:14px;color:var(--muted)}
.edit input[type=text],.edit input[type=number],.edit select,.import textarea{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:16px;color:var(--ink)}
.edit .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit .cb{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:16px}
.edit .row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.hint{font-size:13px;color:var(--muted)}
.import{margin-top:28px;border-top:1px solid var(--line);padding-top:16px}
.import textarea{min-height:140px;font-size:15px;margin:8px 0}
.danger{color:#B3261E}
@media (prefers-reduced-motion:no-preference){ .receipt li.off button{transition:color .15s} }
</style>
</head>
<body class="locked">
<div class="wrap">
  <header class="top">
    <h1>Veckans inköpslista</h1>
    <div class="status">
      <span id="offerStatus">Laddar…</span>
    </div>
    <div class="status small"><span id="saveStatus"></span></div>
  </header>
  <div id="gate" class="msg" role="status" hidden></div>
  <div id="notice" class="msg warn" role="alert" hidden></div>

  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="list">Erbjudanden</button>
    <button role="tab" aria-selected="false" data-tab="search">Sök</button>
    <button role="tab" aria-selected="false" data-tab="recipes">Recept</button>
    <button role="tab" aria-selected="false" data-tab="shop">Handla</button>
    <button role="tab" aria-selected="false" data-tab="items">Mina varor</button>
  </nav>

  <section id="tab-list"></section>
  <section id="tab-recipes" hidden></section>
  <section id="tab-shop" hidden></section>
  <section id="tab-search" hidden>
    <input class="searchbox" id="q" type="search" placeholder="Sök bland alla erbjudanden, t.ex. falukorv" autocomplete="off" aria-label="Sök bland erbjudanden">
    <div id="searchChips"></div>
    <div class="results" id="results"></div>
  </section>
  <section id="tab-items" hidden></section>
</div>

<script>
// ---- Matchningsmotor ----
const CATS = ["Kött & fisk", "Mejeri", "Frukt & grönt", "Skafferi", "Hushåll & hygien", "Övrigt"];

function norm(s) {
  return (s || "").toLowerCase()
    .replace(/[éèêë]/g, "e").replace(/[áàâ]/g, "a").replace(/[úùûü]/g, "u").replace(/[íìî]/g, "i").replace(/[óòô]/g, "o")
    .replace(/&/g, " & ")
    .replace(/[^a-z0-9åäöæø&' ]+/g, " ")
    .replace(/\s+/g, " ").trim();
}
function num(s) { if (s == null) return null; const t = String(s).trim().replace(",", "."); if (!t) return null; const n = parseFloat(t); return isNaN(n) ? null : n; }

const SIZE_RE = /(ca\s*)?(\d+(?:[.,]\d+)?)(?:\s*-\s*(\d+(?:[.,]\d+)?))?\s*(kg|g|hg|l|dl|cl|ml)\b/i;
function parseSize(s) {
  if (!s) return null;
  const m = String(s).match(SIZE_RE);
  if (!m) return null;
  const a = num(m[2]), b = m[3] ? num(m[3]) : a;
  const u = m[4].toLowerCase();
  const f = { kg: 1000, hg: 100, g: 1, l: 1000, dl: 100, cl: 10, ml: 1 }[u];
  return { kind: /l$/.test(u) ? "vol" : "mass", min: a * f, max: b * f }; // gram eller ml
}
function looksLikeSize(s) { return !!s && /^\s*(ca\s*)?\d+(?:[.,]\d+)?(?:\s*-\s*\d+(?:[.,]\d+)?)?\s*(kg|g|hg|l|dl|cl|ml|-p|p)\b/i.test(s); }

function parseOffers(text) {
  const stores = []; let cur = null;
  const lines = (text || "").replace(/\r/g, "").replace(/\u00a0/g, " ").split("\n");
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    if (/^#\s*BUTIK\s*:/i.test(line)) {
      const parts = line.replace(/^#\s*BUTIK\s*:\s*/i, "").split("|").map(s => s.trim());
      cur = { full: parts[0], week: null, valid: null, offers: [] };
      for (const p of parts.slice(1)) {
        const m = p.match(/^(VECKA|GILTIGT)\s*:\s*(.+)$/i);
        if (m) { if (/vecka/i.test(m[1])) cur.week = m[2]; else cur.valid = m[2]; }
      }
      stores.push(cur); continue;
    }
    if (line.startsWith("#") || /^NAMN\|/i.test(line)) continue;
    if (!cur) { cur = { full: "Okänd butik", offers: [] }; stores.push(cur); }
    const f = line.split("|").map(s => s.trim());
    while (f.length < 11) f.push("");
    let [name, brand, size, price, unit, cmp, save, plus, max, qty, link] = f;
    if (!size && looksLikeSize(brand)) { size = brand; brand = ""; } // förskjuten rad
    const p = num(price); if (p == null) continue;
    const q = Math.max(1, num(qty) || 1);
    cur.offers.push({ name, brand, size, price: p, unit: (unit || "").toLowerCase(), cmp, plus: !!plus && !/^(nej|no|0|false)$/i.test(plus), max, qty: q, store: cur.full, link: /^https:\/\//.test(link) ? link : "" });
  }
  // korta butiksnamn: ta bort ord som finns i alla butiksnamn (t.ex. ortnamnet)
  if (stores.length > 1) {
    const sets = stores.map(s => new Set(s.full.split(/\s+/)));
    const common = [...sets[0]].filter(w => sets.every(st => st.has(w)));
    for (const s of stores) {
      const words = s.full.split(/\s+/); const i = words.findIndex(w => common.includes(w));
      s.short = (i > 0 ? words.slice(0, i) : words.filter(w => !common.includes(w))).join(" ") || s.full;
    }
  } else stores.forEach(s => s.short = s.full.replace(/\s+(Trollhättan|Göteborg|Stockholm|Malmö|Uppsala|Vänersborg)\b.*$/i, ""));
  for (const s of stores) for (const o of s.offers) o.storeShort = s.short;
  return stores;
}

// Pris per jämförenhet. Returnerar {kg:[min,max], l:[min,max], each}
function unitPrices(o) {
  const each = o.price / o.qty;
  const r = { each, kg: null, l: null };
  if (o.unit === "kg") r.kg = [each, each];
  else if (o.unit === "hg") r.kg = [each * 10, each * 10];
  else {
    const sz = parseSize(o.size) || parseSize(o.name);
    if (sz) {
      const lo = each / (sz.max / 1000), hi = each / (sz.min / 1000);
      if (sz.kind === "mass") r.kg = [lo, hi]; else r.l = [lo, hi];
    }
  }
  return r;
}

function wordMatch(textWords, textJoined, w) {
  if (w.startsWith("^")) { const x = w.slice(1); return textWords.some(t => t.startsWith(x)); }
  if (w.endsWith("$")) { const x = w.slice(0, -1); return textWords.some(t => t.endsWith(x)); }
  return textJoined.includes(w);
}
function termMatch(text, term) {
  const words = text.split(" ");
  const ws = term.trim().split(/\s+/).map(normWord).filter(w => w.replace(/[\^$]/g, ""));
  return ws.length > 0 && ws.every(w => wordMatch(words, text, w));
}
function normWord(w) { const pre = w.startsWith("^") ? "^" : "", post = w.endsWith("$") ? "$" : ""; return pre + norm(w.replace(/[\^$]/g, "")).replace(/ /g, "") + post; }

// Prisvillkor: {max, per} där per ∈ kg | l | st | 500g
function checkPrice(item, o) {
  if (item.max == null || item.max === "") return { ok: true };
  const max = Number(item.max);
  const up = unitPrices(o);
  const per = item.per || "st";
  if (per === "kg" || per === "l" || per === "500g") {
    const arr = per === "l" ? up.l : up.kg;
    if (!arr) return { ok: null, reason: "Priset kunde inte räknas om till kr/" + (per === "500g" ? "500 g" : per) };
    const best = per === "500g" ? arr[0] / 2 : arr[0];
    return { ok: best <= max + 1e-9, value: best, per };
  }
  return { ok: up.each <= max + 1e-9, value: up.each, per: "st" };
}

function matchAll(stores, items) {
  const out = []; // {store, rows:[{item, offer, check}]}, plus uncertain
  const uncertain = [];
  for (const s of stores) {
    const rows = [];
    for (const o of s.offers) {
      const text = norm(o.name + " " + o.brand);
      const brandText = norm(o.brand + " " + o.name);
      for (const it of items) {
        if (!it.terms || !it.terms.length) continue;
        if (it.not && it.not.some(n => n && termMatch(text, n))) continue;
        if (!it.terms.some(t => t && termMatch(text, t))) continue;
        if (it.brand && !termMatch(brandText, it.brand)) continue;
        const c = checkPrice(it, o);
        if (c.ok === true) rows.push({ item: it, offer: o, check: c });
        else if (c.ok === null) uncertain.push({ item: it, offer: o, check: c });
      }
    }
    // En träff per erbjudande: behåll första (ordning i intresselistan)
    const seen = new Set();
    const dedup = rows.filter(r => { if (seen.has(r.offer)) return false; seen.add(r.offer); return true; });
    const order = new Map(items.map((it, i) => [it, (CATS.indexOf(it.cat) + 1) * 10000 + i]));
    dedup.sort((x, y) => order.get(x.item) - order.get(y.item));
    out.push({ store: s, rows: dedup });
  }
  return { byStore: out, uncertain };
}

function fmt(n) { return n.toFixed(2); }
function amountText(o) {
  if (o.qty > 1) return `${o.qty} för ${fmt(o.price)} kr`;
  if (o.unit === "kg" || o.unit === "hg") return `${fmt(o.price)} kr/${o.unit}`;
  if (o.size) return `${o.size} ${fmt(o.price)} kr`;
  return `${fmt(o.price)} kr` + (o.unit === "st" ? "/st" : "");
}
function lineFor(item, o) {
  let name = item.name.toLowerCase();
  if (item.star) {
    const parts = [];
    if (o.brand) parts.push(o.brand);
    const on = norm(o.name), inm = norm(item.name);
    if (on !== inm && !(on.startsWith(inm) && on.length - inm.length < 3)) parts.push(o.name);

  for (const g of shown) {
    root.append(el("h2", { class: "res-store" }, g.custom ? "Egna varor" : (stores.find(x => x.full === g.full) || {}).short || g.name));
    const ul = el("ul", { class: "shoplist" });
    for (const l of g.lines) {
      const done = bought.has(l.key);
      ul.append(el("li", { class: done ? "done" : "" },
        el("button", { class: "tick", role: "checkbox", "aria-checked": done ? "true" : "false", onclick: () => {
          const b = new Set(profile.bought || []); b.has(l.key) ? b.delete(l.key) : b.add(l.key); profile.bought = [...b]; persist(); renderShop();
        } }, el("span", { class: "box", "aria-hidden": "true" }), el("span", { class: "txt" }, l.text)),
        prodLink(l.link, l.text),
        l.custom ? el("button", { class: "rm", "aria-label": "Ta bort " + l.text, onclick: () => { profile.custom = (profile.custom || []).filter(c => c.id !== l.id); persist(); renderShop(); renderList(); } }, "×") : null,
        l.custom && !done ? offerHint(l.text) : null));
    }
    root.append(ul);
  }
  const toast = el("span", { class: "toast", role: "status" });
  root.append(el("div", { class: "actions" },
    el("button", { class: "btn", onclick: () => copy(receiptText(shown, ex), toast, root) }, "Kopiera listan"),
    bought.size ? el("button", { class: "btn ghost small", onclick: () => { profile.bought = []; persist(); renderShop(); } }, "Avmarkera alla") : null,
    (profile.custom || []).length ? el("button", { class: "btn ghost small", onclick: () => { if (confirm("Ta bort alla egna varor?")) { profile.custom = []; persist(); renderShop(); renderList(); } } }, "Ta bort egna varor") : null,
    toast));
}

// ---------- render: search ----------
function perLabel(p) { return p === "500g" ? "500 g" : p === "st" ? "st" : p; }
function renderSearch() {
  const q = $("#q").value.trim(); const box = $("#results"); box.replaceChildren();
  const cw = $("#searchChips"); cw.replaceChildren(); const ch = storeChips(() => { renderSearch(); renderList(); }); if (ch) cw.append(ch);
  if (!offers) { box.append(el("p", { class: "muted" }, "Inga erbjudanden att söka bland just nu.")); return; }
  if (q.length < 2) { box.append(el("p", { class: "muted" }, "Skriv minst två bokstäver. Du söker bland alla erbjudanden, inte bara din lista.")); return; }
  const nq = norm(q); let total = 0;
  const vis = visibleStores();
  const added = new Set((profile.extras || []).map(offerKey));
  for (const s of vis) {
    const hits = s.offers.filter(o => termMatch(norm(o.name + " " + o.brand), nq));
    if (!hits.length) continue; total += hits.length;
    box.append(el("h2", { class: "res-store" }, s.short));
    for (const o of hits) {
      const up = unitPrices(o);
      const cmp = up.kg && o.unit !== "kg" ? `ca ${Math.round(up.kg[0])} kr/kg` : up.l ? `ca ${Math.round(up.l[0])} kr/l` : "";
      const isAdded = added.has(offerKey(o));
      box.append(el("div", { class: "hit" },
        el("div", {}, el("div", { class: "n" }, o.name), el("div", { class: "d" }, [o.brand, o.size, cmp, o.plus ? "kräver medlemskap" : ""].filter(Boolean).join(" · "))),
        el("div", { class: "tagprice" }, o.qty > 1 ? `${o.qty} för ${o.price.toFixed(2).replace(".", ",")}` : o.price.toFixed(2).replace(".", ",") + (o.unit === "kg" || o.unit === "hg" ? "/" + o.unit : "")),
        el("div", { class: "hitact" },
          el("button", { class: "btn small add " + (isAdded ? "ghost" : ""), disabled: isAdded, onclick: (ev) => addExtra(o, ev.currentTarget) }, isAdded ? "Tillagd i listan" : "Lägg till i listan"),
          o.link ? el("a", { class: "btn ghost small hitlink", href: o.link, target: "_blank", rel: "noopener noreferrer" }, "Visa varan ↗") : null)));
    }
  }
  if (!total) box.append(el("p", {}, `Inget erbjudande innehåller ”${q}” den här veckan` + (vis.length < stores.length ? " i butikerna du valt." : ".")));
}
function addExtra(o, btn) {
  const x = { store: o.store, storeShort: o.storeShort, name: o.name, brand: o.brand, size: o.size, price: o.price, unit: o.unit, qty: o.qty, plus: o.plus, link: o.link || "" };
  profile.extras = [...(profile.extras || []), x]; persist();
  btn.textContent = "Tillagd i listan"; btn.disabled = true; btn.classList.add("ghost");
  renderList();
}

// ---------- personliga länkar ----------
function copyBtn(text, label) {
  return el("button", { class: "btn small", onclick: async (ev) => { const b = ev.currentTarget; try { await navigator.clipboard.writeText(text); b.textContent = "Kopierad"; setTimeout(() => b.textContent = label, 2000); } catch (e) { prompt("Kopiera länken:", text); } } }, label);
}
function linkBox() {
  if (!CODE || cloudState === "invalid") return null;
  return el("div", { class: "msg" },
    el("p", {}, el("b", {}, "Det här är din personliga länk.")),
    el("p", { class: "small muted" }, "Spara den på hemskärmen och öppna listan därifrån på alla dina enheter. Den som har länken kan se och ändra listan, så dela den inte med andra."),
    el("div", { class: "actions" }, copyBtn(linkFor(CODE), "Kopiera min länk")));
}

// ---------- render: items ----------
function condText(it) {
  const c = [];
  if (it.max != null && it.max !== "") c.push(`max ${String(it.max).replace(".", ",")} kr/${perLabel(it.per)}`);
  if (it.brand) c.push("bara " + it.brand);
  if (it.star) c.push("visa märke");
  return c.join(" · ");
}
function renderItems() {
  const root = $("#tab-items"); root.replaceChildren();
  const lb = CLOUD_ON ? linkBox() : null; if (lb) root.append(lb);
  root.append(el("p", { class: "muted small" }, "Det här är varorna du brukar köpa. Tryck på en vara för att ändra prisgräns, märke eller sökord."));
  for (const cat of CATS) {
    const list = profile.items.filter(i => (i.cat || "Övrigt") === cat);
    if (!list.length && cat === "Övrigt") { /* visa bara om det finns något */ }
    root.append(el("h2", { class: "cat" }, cat, el("button", { class: "btn ghost small", onclick: () => addItem(cat) }, "Lägg till")));
    for (const it of list) root.append(itemEl(it));
  }
  const ta = el("textarea", { placeholder: "Kött & fisk\n*kycklinginnerfilé\nNötfärs (max 120 kr/kg)\n…", "aria-label": "Klistra in intresselista" });
  root.append(el("div", { class: "import" },
    el("h2", { class: "cat" }, "Klistra in en hel lista"),
    el("p", { class: "small muted" }, "Vill du flytta listan till mobilen eller ge den till någon? Tryck på Kopiera min lista, skicka texten och klistra in den här på den andra enheten. Du kan också klistra in en lista i Copilot-formatet: rubriker som Mejeri på egna rader, * framför en vara för att se märke och (max 40 kr/kg) för prisgräns. Listan ersätter den du har nu."),
    ta,
    el("div", { class: "actions" },
      el("button", { class: "btn", onclick: () => { const items = importJSON(ta.value) || parseInterestText(ta.value); if (!items.length) return; if (!confirm(`Ersätta din lista med ${items.length} varor?`)) return; profile.items = items; persist(); renderAll(); } }, "Ersätt min lista"),
      el("button", { class: "btn ghost small", onclick: async (ev) => { const t = exportJSON(); try { await navigator.clipboard.writeText(t); ev.currentTarget.textContent = "Kopierad"; } catch (e) { ta.value = t; ta.select(); } } }, "Kopiera min lista"),
      el("button", { class: "btn ghost small", onclick: () => { if (confirm("Återställa till standardlistan?")) { profile.items = defaultItems(); persist(); renderAll(); } } }, "Återställ standardlistan"),
      el("button", { class: "btn ghost small danger", onclick: () => { if (confirm("Tömma hela listan?")) { profile.items = []; persist(); renderAll(); } } }, "Töm listan"))));
}
function itemEl(it) {
  const open = editingId === it.id;
  const wrap = el("div", { class: "item" },
    el("button", { class: "row", "aria-expanded": open ? "true" : "false", onclick: () => { editingId = open ? null : it.id; renderItems(); } },
      el("span", { class: "nm" }, it.name), el("span", { class: "cond" }, condText(it))));
  if (!open) return wrap;
  const f = {};
  const inp = (key, attrs) => (f[key] = el("input", attrs));
  f.cat = el("select", {}, CATS.map(c => el("option", { value: c, selected: c === it.cat }, c)));
  f.per = el("select", {}, [["kg", "kr/kg"], ["l", "kr/liter"], ["st", "kr/st eller förpackning"], ["500g", "kr per 500 g"]].map(([v, t]) => el("option", { value: v, selected: v === (it.per || "st") }, t)));
  f.star = el("input", { type: "checkbox", checked: !!it.star });
  wrap.append(el("div", { class: "edit" },
    el("label", {}, "Namn i listan", inp("name", { type: "text", value: it.name })),
    el("div", { class: "two" },
      el("label", {}, "Maxpris (tomt = alltid)", inp("max", { type: "number", step: "0.01", min: "0", inputmode: "decimal", value: it.max ?? "" })),
      el("label", {}, "Per", f.per)),
    el("label", {}, "Bara detta märke (valfritt)", inp("brand", { type: "text", value: it.brand || "", placeholder: "t.ex. Felix" })),
    el("label", { class: "cb" }, f.star, "Visa märke och variant i listan"),
    el("label", {}, "Sökord, separera med komma", inp("terms", { type: "text", value: (it.terms || []).join(", ") }),
      el("span", { class: "hint" }, "Ett erbjudande räknas som träff om namnet innehåller något av orden. ^ först = ordet börjar så (^ägg missar pålägg), $ sist = ordet slutar så (ost$ hittar prästost).")),
    el("label", {}, "Uteslut om namnet innehåller", inp("not", { type: "text", value: (it.not || []).join(", "), placeholder: "t.ex. juice, sås" })),
    el("label", {}, "Kategori", f.cat),
    el("div", { class: "row2" },
      el("button", { class: "btn small", onclick: () => {
        it.name = f.name.value.trim() || it.name;
        const m = f.max.value.trim(); it.max = m === "" ? null : Number(m.replace(",", "."));
        it.per = f.per.value; it.brand = f.brand.value.trim(); it.star = f.star.checked; it.cat = f.cat.value;
        it.terms = f.terms.value.split(",").map(s => s.trim()).filter(Boolean); if (!it.terms.length) it.terms = [it.name.toLowerCase()];
        it.not = f.not.value.split(",").map(s => s.trim()).filter(Boolean);
        editingId = null; persist(); renderAll();
      } }, "Spara"),
      el("button", { class: "btn ghost small danger", onclick: () => { profile.items = profile.items.filter(x => x !== it); editingId = null; persist(); renderAll(); } }, "Ta bort varan"))));
  setTimeout(() => f.name.focus(), 0);
  return wrap;
}
function addItem(cat) {
  const it = { id: Math.random().toString(36).slice(2, 10), cat, name: "Ny vara", star: false, max: null, per: "st", brand: "", terms: [], not: [] };
  profile.items.push(it); editingId = it.id; renderItems();
  // namn fylls i av användaren; sökord sätts vid Spara
}

// ---------- erbjudanden ----------
let siteOffers = null;
function sig(t) { let h = 0; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) | 0; return t.length + ":" + h; }
function useOffers(o) {
  offers = o; stores = parseOffers(o.text);
  const sg = sig(o.text);
  if (profile.offersSig !== sg) { profile.offersSig = sg; profile.excluded = []; profile.extras = []; profile.bought = []; persist(); }
  lsSet(LS_OFFERS, o);
}
async function loadSite() {
  try {
    const r = await fetch("erbjudanden.txt", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const text = await r.text();
    if (!parseOffers(text).some(s => s.offers.length)) throw new Error("tom");
    const lm = r.headers.get("last-modified");
    siteOffers = { text, fileName: "erbjudanden.txt", uploadedAt: lm ? new Date(lm).toISOString() : new Date().toISOString(), source: "site" };
    useOffers(siteOffers);
  } catch (e) { /* ingen fil på webbplatsen, eller sidan öppnad som lokal fil */ }
  renderAll();
}

// ---------- flytta listan mellan enheter ----------
function listAsText() {
  return CATS.map(cat => {
    const its = profile.items.filter(i => (i.cat || "Övrigt") === cat); if (!its.length) return "";
    return [cat, ...its.map(i => (i.star ? "*" : "") + i.name + (i.max != null && i.max !== "" ? ` (max ${i.max} kr/${i.per === "500g" ? "förp 500g" : i.per})` : ""))].join("\n");
  }).filter(Boolean).join("\n\n");
}
function exportJSON() { return "INKOPSLISTA:" + btoa(unescape(encodeURIComponent(JSON.stringify(profile.items)))); }
function importJSON(t) { const m = t.trim().match(/^INKOPSLISTA:(.+)$/s); if (!m) return null; try { const a = JSON.parse(decodeURIComponent(escape(atob(m[1].trim())))); return Array.isArray(a) ? a : null; } catch (e) { return null; } }

// ---------- tabs ----------
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("nav.tabs button").forEach(x => x.setAttribute("aria-selected", x === b ? "true" : "false"));
  for (const t of ["list", "recipes", "shop", "search", "items"]) $("#tab-" + t).hidden = t !== b.dataset.tab;
  if (b.dataset.tab === "search") { renderSearch(); $("#q").focus(); }
  if (b.dataset.tab === "shop") renderShop();
  if (b.dataset.tab === "recipes") renderRecipes();
}));
let qTimer; $("#q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(renderSearch, 120); });

function renderAll() { renderStatus(); renderList(); renderShop(); renderItems(); if (!$("#tab-recipes").hidden) renderRecipes(); if (!$("#tab-search").hidden) renderSearch(); }

// ---------- spärr: bara giltiga personliga länkar ----------
function lock(msg, title) {
  document.body.classList.add("locked");
  const g = $("#gate"); g.hidden = false;
  g.replaceChildren(el("p", {}, el("b", {}, title || "Den här sidan kräver en personlig länk.")), msg ? el("p", { class: "small muted" }, msg) : null);
}
function unlock() { document.body.classList.remove("locked"); $("#gate").hidden = true; }
const VALID_KEY = CODE ? "ink.valid." + CODE : null;
(async function start() {
  if (!CODE || !CLOUD_ON) { lock("Öppna inköpslistan via din personliga länk. Har du ingen, fråga den som delade appen med dig."); return; }
  const known = !!lsGet(VALID_KEY);
  if (known) { renderAll(); unlock(); } else lock("", "Hämtar din lista…");
  await cloudRefresh();
  if (cloudState === "invalid") {
    try { localStorage.removeItem(VALID_KEY); localStorage.removeItem(LS_PROFILE); } catch (e) {}
    lock("Kontrollera att du har kopierat hela länken, eller fråga den som gav dig den.", "Den här länken är inte giltig.");
    return;
  }
  if (cloudState === "error" && !known) { lock("Kontrollera internetanslutningen och ladda om sidan.", "Kunde inte hämta din lista just nu."); return; }
  lsSet(VALID_KEY, true); unlock();
  loadRecipes();
  await loadSite();
})();
})();
</script>
</body>
</html>
